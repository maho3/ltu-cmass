defaults:
  - mixk
  - _self_

# kmax=0.3 cuts, trained separately from mixk (2026-09-30)
experiments:
  - summary: [zPk0]
    kmin: [0.]
    kmax: [0.3]
  - summary: [zPk0, zPk2, zPk4]
    kmin: [0.]
    kmax: [0.3]
  - summary: [zPk0, zPk2, zPk4, zBk0]
    kmin: [0.]
    kmax:
      - {zPk: 0.3, zBk: 0.3}
